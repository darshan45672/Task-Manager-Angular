<div class="grid-layout-1 mt-16 gap-10">
    <a [routerLink]="['/project-details']" class="item1 box-card-project style-2 bg-1">
        <div class="d-flex align-items-center justify-content-between">
            <div class="box-icon w-36">
                <i class="icon-wallet"></i>
            </div>
            <div class="box-icon-flag">
                <i class="icon-priority"></i>
                High
            </div>
        </div>
        <div class="mt-8 h8 fw-bold text-white">Banking Platform Web & Mobile App</div>
        <ul class="mt-8 d-flex gap-4 align-items-center meta-list">
            <li class="d-flex align-items-center gap-4 text-caption-3"><i class="icon-calendar fs-10"></i> June28, 2022
            </li>
            <li class="dot"></li>
            <li class="d-flex align-items-center gap-4 text-caption-3"><i class="icon-chat2 fs-10"></i>16</li>
        </ul>
        <ul class="mt-8 list-stacked">
            <li class="avt-list">
                <div class="avatar avt-22 round">
                    <img src="images/avt/avt3.jpg" alt="img">
                </div>
            </li>
            <li class="avt-list">
                <div class="avatar avt-22 round">
                    <img src="images/avt/avt4.jpg" alt="img">
                </div>
            </li>
            <li class="avt-list">
                <div class="avatar avt-22 round">
                    <img src="images/avt/avt5.jpg" alt="img">
                </div>
            </li>
            <li class="avt-list">
                <div class="avatar avt-22 round member">
                    3+
                </div>
            </li>
        </ul>
        <div class="box-progress">
            <div class="progress h-5">
                <div class="progress-bar progress-animated" role="progressbar" style="width: 78%" aria-valuenow="25"
                    aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="mt-6 d-flex justify-content-between align-items-center progress-desc">
                <span class="text-caption-3 title">In Progress</span>
                <span class="fw-6 text-caption-3 value">78%</span>
            </div>
        </div>
    </a>
    <a [routerLink]="['/project-details']" class="item2 box-card-project style-2 bg-2">

            <li class="d-flex align-items-center gap-4 text-caption-3"><i class="icon-calendar fs-10"></i> June 15, 2022
            </li>
            <li class="dot"></li>
            <li class="d-flex align-items-center gap-4 text-caption-3"><i class="icon-chat2 fs-10"></i>16</li>
        </ul>
        <div class="box-progress">
            <div class="progress h-5">
                <div class="progress-bar progress-animated" role="progressbar" style="width: 56%" aria-valuenow="25"
                    aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="mt-6 d-flex justify-content-between align-items-center progress-desc">
                <span class="text-caption-3 title">In Progress</span>
                <span class="fw-6 text-caption-3 value">56%</span>
            </div>

    <a [routerLink]="['/project-details']" class="item3 box-card-project style-2 bg-3">

            </li>
            <li class="dot"></li>
            <li class="d-flex align-items-center gap-4 text-caption-3"><i class="icon-chat2 fs-10"></i>16</li>

        <div class="box-progress">
